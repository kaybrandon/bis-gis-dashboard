<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIS is grabbing a coffee</title>
  <!--
    GIS-UI-08 — Azure App Service deploy holding page (self-contained).
    Known path in repo: deploy/app_offline.htm

    IIS / ANCM only serves THIS file while it sits at the App Service site root.
    Do not reference external CSS, fonts, or images — they will also get this HTML.

    Place (pack zip / prod push to appgisdashboard):
      After `dotnet publish ... -o publish`, copy this file to the zip/site root
      (next to GisDashboard.Api.dll and web.config — not under the SPA wwwroot/):
        cp deploy/app_offline.htm publish/app_offline.htm
      Then zip the publish folder and zipdeploy. While the file is at
      /home/site/wwwroot/app_offline.htm, visitors get this page instead of blank/500.

    Remove (when the new bits are healthy):
      Delete the site-root file so the app comes back:
        Kudu VFS DELETE /api/vfs/site/wwwroot/app_offline.htm
        or Kudu console / FTP: remove app_offline.htm from D:\home\site\wwwroot\
      Do not leave app_offline.htm in the site root after a healthy deploy.
  -->
  <style>
    :root {
      --cream: #f7f1e8;
      --foam: #fffaf3;
      --coffee: #6b4423;
      --latte: #c4a574;
      --ink: #3d2b1f;
      --muted: #6a5344;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at top, #fff8ee 0%, var(--cream) 55%, #efe4d2 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    main {
      max-width: 28rem;
      text-align: center;
    }

    .mug {
      width: 168px;
      height: 168px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 12px;
    }

    .soon {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0 0 28px;
    }

    .sig {
      margin: 0;
      color: var(--coffee);
      font-style: italic;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <svg class="mug" viewBox="0 0 200 200" role="img" aria-label="Coffee mug">
      <ellipse cx="92" cy="178" rx="48" ry="8" fill="#e4d3b8" />

      <path d="M148 92c22 2 30 28 14 48-8 10-20 12-30 8" fill="none" stroke="#6b4423" stroke-width="12" stroke-linecap="round" />
      <path d="M148 92c22 2 30 28 14 48-8 10-20 12-30 8" fill="none" stroke="#f4e6d0" stroke-width="5" stroke-linecap="round" />
      <path d="M48 86h92c6 0 10 5 10 10v42c0 28-22 42-56 42s-56-14-56-42V96c0-5 4-10 10-10z" fill="#f4e6d0" stroke="#6b4423" stroke-width="4" />
      <ellipse cx="94" cy="88" rx="46" ry="14" fill="#5c3317" />
      <ellipse cx="94" cy="84" rx="34" ry="8" fill="#7a4a22" opacity="0.85" />
      <circle cx="78" cy="122" r="5" fill="#6b4423" />
      <circle cx="110" cy="122" r="5" fill="#6b4423" />
      <circle cx="80" cy="120" r="1.6" fill="#fffaf3" />
      <circle cx="112" cy="120" r="1.6" fill="#fffaf3" />
      <path d="M80 140c8 10 22 10 30 0" fill="none" stroke="#6b4423" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="64" cy="108" r="7" fill="#e8c9a8" />
      <circle cx="124" cy="108" r="7" fill="#e8c9a8" />
    </svg>
    <h1>GIS is grabbing a coffee while we ship an update.</h1>
    <p class="soon">Back in a few minutes — try again shortly.</p>
    <p class="sig">— Alex</p>
  </main>
</body>
</html>
